apiVersion: batch/v1
kind: CronJob
metadata:
  name: dependency-agent
  namespace: dev-team-agents
  labels:
    app: dependency-agent
    team: dev-team
    domain: intelligence
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: dependency-agent
            team: dev-team
            domain: intelligence
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/role: "dependency-agent-role"
            vault.hashicorp.com/agent-inject-secret-credentials: "secret/data/dev-team/dependency-agent"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: dependency-agent-sa
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            fsGroup: 0
          containers:
            - name: dependency-agent
              image: registry.internal/dev-team/dependency-agent:latest
              command: ["python", "-m", "dependency_agent"]
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
              env:
                - name: LANGCHAIN_TRACING_V2
                  value: "true"
                - name: LANGCHAIN_ENDPOINT
                  value: "http://langsmith.dev-team-platform.svc.cluster.local:1984"
                - name: LANGCHAIN_PROJECT
                  value: "dev-team"
                - name: REDIS_URL
                  value: "redis://redis.dev-team-platform.svc.cluster.local:6379"
                - name: VLLM_UTILITY_URL
                  value: "http://vllm-utility.dev-team-inference.svc.cluster.local:8080/v1"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
