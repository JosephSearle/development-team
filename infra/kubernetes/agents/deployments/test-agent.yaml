apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-agent
  namespace: dev-team-agents
  labels:
    app: test-agent
    team: dev-team
    domain: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-agent
  template:
    metadata:
      labels:
        app: test-agent
        team: dev-team
        domain: development
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "test-agent-role"
        vault.hashicorp.com/agent-inject-secret-credentials: "secret/data/dev-team/test-agent"
    spec:
      serviceAccountName: test-agent-sa
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 0
      containers:
        - name: test-agent
          image: registry.internal/dev-team/test-agent:latest
          command: ["python", "-m", "test_agent"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: LANGCHAIN_TRACING_V2
              value: "true"
            - name: LANGCHAIN_ENDPOINT
              value: "http://langsmith.dev-team-platform.svc.cluster.local:1984"
            - name: LANGCHAIN_PROJECT
              value: "dev-team"
            - name: REDIS_URL
              value: "redis://redis.dev-team-platform.svc.cluster.local:6379"
            - name: VLLM_CODE_URL
              value: "http://vllm-code.dev-team-inference.svc.cluster.local:8080/v1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
