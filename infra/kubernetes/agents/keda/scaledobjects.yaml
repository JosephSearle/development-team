# KEDA ScaledObjects for agents with variable load.
# Trigger: Prometheus metric from self-hosted LangSmith (task queue depth per agent).
# Agents with fixed replicas (code-review, cicd, architecture, docs, infrastructure,
# incident-response, dependency) are omitted — they are not scaled by KEDA.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: orchestrator-scaler
  namespace: dev-team-agents
spec:
  scaleTargetRef:
    name: orchestrator
  minReplicaCount: 2
  maxReplicaCount: 6
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://langsmith.dev-team-platform.svc.cluster.local:1984
        metricName: langsmith_pending_tasks_orchestrator
        query: langsmith_pending_tasks{agent="orchestrator"}
        threshold: "5"
---
