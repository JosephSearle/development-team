    namespace: dev-team-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-agent-read-role
  namespace: dev-team-inference
rules:
  - apiGroups: ["", "apps", "serving.kserve.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-agent-rolebinding-inference
  namespace: dev-team-inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-agent-read-role
subjects:
  - kind: ServiceAccount
    name: security-agent-sa
    namespace: dev-team-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-agent-read-role
  namespace: dev-team-platform
rules:
  - apiGroups: ["", "apps"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-agent-rolebinding-platform
  namespace: dev-team-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-agent-read-role
subjects:
  - kind: ServiceAccount
    name: security-agent-sa
    namespace: dev-team-agents
---
