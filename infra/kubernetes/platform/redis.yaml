# Redis configuration: noeviction + AOF persistence per architecture §05
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: dev-team-platform
data:
  redis.conf: |
    maxmemory-policy noeviction
    appendonly yes
    appendfsync everysec
    save ""
    protected-mode no
    bind 0.0.0.0
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: dev-team-platform
  labels:
    app: redis
    team: dev-team
spec:
  serviceName: redis
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        team: dev-team
    spec:
      securityContext:
        runAsUser: 999
        runAsNonRoot: true
        fsGroup: 999
      containers:
        - name: redis
          image: registry.access.redhat.com/ubi9/redis-7:latest
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "8Gi"
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
            - name: redis-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: sentinel
          image: registry.access.redhat.com/ubi9/redis-7:latest
          command:
            - sh
            - -c
            - |
              cat > /tmp/sentinel.conf <<EOF
              sentinel monitor mymaster redis-0.redis.dev-team-platform.svc.cluster.local 6379 2
              sentinel down-after-milliseconds mymaster 5000
              sentinel failover-timeout mymaster 60000
              sentinel parallel-syncs mymaster 1
              EOF
              redis-sentinel /tmp/sentinel.conf
          ports:
            - containerPort: 26379
              name: sentinel
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: dev-team-platform
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: dev-team-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: redis
