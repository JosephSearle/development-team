[project]
name = "dev-team-state"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "typing-extensions>=4.12",
  "langgraph-checkpoint-redis>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_team_state"]
