name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "stage", "develop"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run ruff
        run: uv run ruff check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run mypy (shared)
        run: uv run mypy shared/
      - name: Run mypy (orchestrator)
        run: uv run mypy agents/orchestrator/src

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run pytest
        run: uv run pytest shared/ agents/orchestrator/tests/ -v --tb=short --cov=orchestrator --cov-fail-under=80

  integration:
    name: Integration Tests (placeholder)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: echo "Integration tests will be added in Phase 6"
