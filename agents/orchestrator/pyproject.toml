[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "dev-team-state",
  "dev-team-guardrail",
  "dev-team-mcp",
  "test-agent",
  "code-agent",
  "code-review-agent",
  "git-agent",
  "security-agent",
  "cicd-agent",
  "infrastructure-agent",
  "architecture-agent",
  "docs-agent",
  "dependency-agent",
  "incident-response-agent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
dev-team-state = { workspace = true }
dev-team-guardrail = { workspace = true }
dev-team-mcp = { workspace = true }
test-agent = { workspace = true }
code-agent = { workspace = true }
code-review-agent = { workspace = true }
git-agent = { workspace = true }
security-agent = { workspace = true }
cicd-agent = { workspace = true }
infrastructure-agent = { workspace = true }
architecture-agent = { workspace = true }
docs-agent = { workspace = true }
dependency-agent = { workspace = true }
incident-response-agent = { workspace = true }
