[project]
name = "architecture-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "deepagents>=0.6.1",
  "dev-team-state",
  "dev-team-mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/architecture_agent"]

[tool.uv.sources]
dev-team-state = { workspace = true }
dev-team-mcp = { workspace = true }
