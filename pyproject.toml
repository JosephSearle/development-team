[tool.uv.workspace]
members = [
  "shared/state",
  "shared/guardrail",
  "shared/mcp",
  "agents/orchestrator",
  "agents/code_agent",
  "agents/test_agent",
  "agents/code_review_agent",
  "agents/git_agent",
  "agents/architecture_agent",
  "agents/cicd_agent",
  "agents/security_agent",
  "agents/docs_agent",
  "agents/infrastructure_agent",
  "agents/dependency_agent",
  "agents/incident_response_agent",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.0",
  "pytest-mock>=3.15",
  "pytest-httpx>=0.36",
  "pytest-cov>=7",
  "pytest-timeout>=2",
  "testcontainers[redis]>=4.14",
  "ruff>=0.9",
  "mypy>=2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
"**/__init__.py" = ["ANN", "F401"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["shared/.*/tests/.*", "agents/.*/tests/.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
testpaths = [
  "shared/state/tests",
  "shared/guardrail/tests",
  "shared/mcp/tests",
  "agents/orchestrator/tests",
  "agents/test_agent/tests",
  "agents/code_agent/tests",
  "agents/code_review_agent/tests",
  "agents/git_agent/tests",
  "agents/security_agent/tests",
  "agents/cicd_agent/tests",
  "agents/infrastructure_agent/tests",
  "agents/architecture_agent/tests",
  "agents/docs_agent/tests",
  "agents/dependency_agent/tests",
  "agents/incident_response_agent/tests",
  "tests/integration",
]
